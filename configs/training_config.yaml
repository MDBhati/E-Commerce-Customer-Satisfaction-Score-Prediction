training:
  test_size: 0.2
  random_state: 42
  epochs: 100
  batch_size: 32
  validation_split: 0.2

model:
  hidden_layers: [128, 64, 32]
  dropout_rate: 0.3
  num_classes: 5
  optimizer: "adam"
  loss: "categorical_crossentropy"

callbacks:
  early_stopping:
    monitor: "val_loss"
    patience: 10
    restore_best_weights: true
  reduce_lr:
    monitor: "val_loss"
    factor: 0.2
    patience: 5
    min_lr: 0.00001
